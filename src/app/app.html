<app-withdrawal-notice></app-withdrawal-notice>
<router-outlet #outlet="outlet"></router-outlet>
<aside *ngIf="showInstallPrompt && !isStandalone" class="install-prompt"
       [class.dashboard-install]="outlet.activatedRouteData['dashboard']" role="dialog" aria-label="Install Betzion app">
  <img src="/assets/icons/betzion-icon-512.png" alt="">
  <div class="install-copy">
    <strong>Betzion App</strong>
    <span>Add Betzion to your home screen.</span>
    <p *ngIf="installHelpVisible">In Chrome or Brave, open the browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>
  </div>
  <button type="button" class="install-action" (click)="installApp()">Install app</button>
  <button type="button" class="install-dismiss" aria-label="Close install prompt" (click)="dismissInstallPrompt()">×</button>
</aside>
