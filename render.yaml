services:
  - type: web
    name: betzion-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render assigns PORT itself; server.js already reads process.env.PORT.
      # Every value below is a secret or environment-specific, so it is set in
      # the Render dashboard rather than committed here.
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: betzion
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYHERO_API_BASE
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_BASIC_AUTH_TOKEN
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        value: https://api.betzion.site/api/payments/payhero/callback
      - key: PAYHERO_CALLBACK_TOKEN
        sync: false
      - key: PAYHERO_TEST_MODE
        value: "false"
      - key: PAYHERO_PENDING_PAYMENT_EXPIRY_MS
        value: "300000"
      - key: PAYHERO_LATE_CONFIRMATION_WINDOW_MS
        value: "1800000"
      - key: MIN_DEPOSIT_AMOUNT
        value: "999"
      - key: SEED_ADMIN_PHONE
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
